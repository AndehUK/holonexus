services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - holonexus_dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holonexus -d holonexus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:

networks:
  holonexus_dev_network:
    driver: bridge
